# Settings for run-gate.sh and the hooks. Plain KEY=value; sourced by sh and bash.

PROTECTED_BRANCH=main

# Throwaway Postgres started for each gated run, removed afterwards.
PG_IMAGE=postgres:18-bookworm
PG_PORT=55433
PG_CONTAINER=main-test-gate-pg
PG_DB=example

# Services to build and start, in order. Each needs .githooks/recipes/<name>.sh.
SERVICES="example-api"

# A change under any of these paths (or to PIN_FILE) triggers the gate.
TRIGGER_PATHS="services/ src/"

# Pins which commit of the test repo to run.
PIN_FILE=services/example-api/test.env

# Local clone of the test repo. Used directly when its HEAD matches the pin,
# otherwise the pinned commit is checked out into .git/gate-cache/ as a worktree.
TESTS_LOCAL_DIR=C:/Data/GitProjects/main-test-tests

TEST_CMD="npm test --silent"
BASE_URL_VAR=API_BASE_URL
BASE_URL_SERVICE=example-api

HEALTH_TIMEOUT_SEC=60
